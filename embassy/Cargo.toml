[package]
name = "embassy-hc32"
version = "0.1.0"
edition = "2024"
description = "Embassy HAL and runtime support for Xiaohua / HDSC HC32F460 microcontrollers"
license = "MIT OR Apache-2.0"
# The generated PAC's redistribution terms still require review.
publish = false
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["arm", "cortex-m", "hc32", "hal", "embassy"]

[package.metadata.docs.rs]
targets = ["thumbv7em-none-eabihf"]

[features]
# Bring-up diagnostic only; default builds use interrupt-driven receive waits.
i2c-rx-poll-diagnostic = []

[dependencies]
cortex-m.workspace = true
critical-section.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time = { workspace = true, features = ["tick-hz-1_000"] }
embassy-time-driver.workspace = true
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-16"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
hc32f460-pac = { path = "../pac", default-features = false }
